<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gilded Hour — a heist game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0d1a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  /* Outline, never a border: a border would inflate the element box past
     the 1280px screenshot cap. */
  canvas {
    outline: 2px solid #b08d3e;
    outline-offset: 0;
    display: block;
    background: #101736;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
